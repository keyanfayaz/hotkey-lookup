<!doctype html>
<html lang="en" class="h-full dark" data-theme="dark" data-accent="amber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- title and description are injected per-route by Seo.tsx via react-helmet-async -->
    <meta name="application-name" content="Hotkey Lookup" />
    <meta name="apple-mobile-web-app-title" content="Hotkey Lookup" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Hotkey Lookup" />
    <meta
      name="keywords"
      content="keyboard shortcuts, hotkeys, macOS shortcuts, Windows shortcuts, Linux shortcuts, Chrome shortcuts, VS Code shortcuts, Figma shortcuts, Slack shortcuts, Notion shortcuts, cheatsheet, keybindings"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Per-page canonical, OG, and JSON-LD are injected by src/components/Seo.tsx -->

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366f1" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default OG image (per-page Seo overrides title/description/url) -->
    <meta property="og:image" content="https://hotkeylookup.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Hotkey Lookup" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- WebApplication / FAQ JSON-LD now emitted per page via src/components/Seo.tsx -->
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
