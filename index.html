    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Hotkey Lookup",
      "alternateName": "HotkeyLookup",
      "url": "https://hotkeylookup.com/",
      "description": "Search keyboard shortcuts across macOS, Windows, and Linux — system-wide and for the apps you use every day. Or press a combo and see what it does everywhere.",
      "applicationCategory": "UtilitiesApplication",
      "applicationSubCategory": "Productivity",
      "operatingSystem": "macOS, Windows, Linux",
      "browserRequirements": "Requires JavaScript. Requires a modern browser.",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Search shortcuts across operating systems",
        "Compare shortcuts between macOS, Windows, and Linux",
        "Browse shortcuts by app or by action",
        "Visualize shortcuts on a keyboard",
        "Listen mode: press a combo to see what it does",
        "Per-app cheatsheets"
      ],
      "image": "https://hotkeylookup.com/og-image.png",
      "screenshot": "https://hotkeylookup.com/og-image.png"
    }
    </script>

    <!-- Structured data: ItemList of supported apps -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Apps and operating systems covered by Hotkey Lookup",
      "itemListOrder": "https://schema.org/ItemListUnordered",
      "numberOfItems": 15,
      "itemListElement": [
        { "@type": "ListItem", "position": 1,  "name": "macOS" },
        { "@type": "ListItem", "position": 2,  "name": "Windows" },
        { "@type": "ListItem", "position": 3,  "name": "Linux" },
        { "@type": "ListItem", "position": 4,  "name": "Chrome" },
        { "@type": "ListItem", "position": 5,  "name": "Firefox" },
        { "@type": "ListItem", "position": 6,  "name": "Safari" },
        { "@type": "ListItem", "position": 7,  "name": "VS Code" },
        { "@type": "ListItem", "position": 8,  "name": "Cursor" },
        { "@type": "ListItem", "position": 9,  "name": "Terminal" },
        { "@type": "ListItem", "position": 10, "name": "Slack" },
        { "@type": "ListItem", "position": 11, "name": "Notion" },
        { "@type": "ListItem", "position": 12, "name": "Linear" },
        { "@type": "ListItem", "position": 13, "name": "Figma" },
        { "@type": "ListItem", "position": 14, "name": "Google Docs" },
        { "@type": "ListItem", "position": 15, "name": "Finder / Explorer" }
      ]
    }
    </script>

    <!-- Structured data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Hotkey Lookup?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hotkey Lookup is a free web tool for searching and comparing keyboard shortcuts across macOS, Windows, and Linux — both system-wide shortcuts and shortcuts for popular apps like Chrome, VS Code, Figma, Slack, Notion, and more."
          }
        },
        {
          "@type": "Question",
          "name": "Which operating systems does it cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hotkey Lookup covers macOS, Windows, and Linux. You can view shortcuts side by side to see how the same action maps across each platform."
          }
        },
        {
          "@type": "Question",
          "name": "Is Hotkey Lookup free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Hotkey Lookup is completely free to use, with no account required."
          }
        },
        {
          "@type": "Question",
          "name": "Can I look up what a key combination does?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Listen mode lets you press a key combination and see what it does across macOS, Windows, Linux, and the apps you use."
          }
        },
        {
          "@type": "Question",
          "name": "Which apps are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Supported apps include Chrome, Firefox, Safari, VS Code, Cursor, Terminal, Slack, Notion, Linear, Figma, Google Docs, and Finder / Explorer, alongside system-wide shortcuts for macOS, Windows, and Linux."
          }
        }
      ]
    }
    </script>
